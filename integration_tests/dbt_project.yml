name: 'sao_integration_tests'
config-version: 2
profile: 'dbt_tripwire_poc'

model-paths: ["models"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

on-run-end:
  - "{{ dbt_tripwire.sao_record_run_results(results) }}"

# Do NOT set sao_enable/sao_disable here, even to false -- permanently
# shadows the env var. Leave unset; export DBT_ENABLE_SAO=true instead.

models:
  sao_integration_tests:
    +meta:
      sao:
        always_build: false
        build_interval_check: true
        build_after_interval_value: 1
        build_after_interval_unit: hour
        build_source_check: true
